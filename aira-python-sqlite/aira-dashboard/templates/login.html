<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aira Dashboard — Sign in</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="preloader" id="preloader"><span class="preloader-mark">Aira</span></div>
  <script>
    window.addEventListener("load", () => {
      setTimeout(() => document.getElementById("preloader").classList.add("hidden"), 350);
    });
  </script>
  <div class="auth-stage">
    <div class="auth-card glass">
      <svg class="auth-mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" fill="#1a1408" stroke="#e8b34c" stroke-width="1.5"/>
        <circle cx="32" cy="32" r="21" stroke="#e8b34c" stroke-width="1.1" opacity="0.7"/>
        <circle cx="32" cy="32" r="12" stroke="#e8b34c" stroke-width="1.1" opacity="0.55"/>
        <g stroke="#f0c877" stroke-width="1" opacity="0.6">
          <line x1="32" y1="2" x2="32" y2="62"/><line x1="2" y1="32" x2="62" y2="32"/>
          <line x1="11" y1="11" x2="53" y2="53"/><line x1="53" y1="11" x2="11" y2="53"/>
        </g>
        <circle cx="32" cy="32" r="4" fill="#e8b34c"/>
      </svg>
      <h2>Aira Godmode Dashboard</h2>
      <p class="sub">Two accounts only. Everyone else, this isn't the bot you're looking for.</p>

      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Continue</button>
      </form>
    </div>
  </div>
</body>
</html>
